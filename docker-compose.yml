services:
  geosync:
    build: .
    image: geosync:latest
    container_name: geosync
    ports:
      - "5000:5000"
    volumes:
      # 两库独立存放：作业库与分析库分别位于两个独立卷，互不耦合；
      # 挂卷后容器重建/重启不丢数据与同步进度。验证断点续传可执行：
      #   docker compose restart   或   docker compose kill && docker compose up -d
      - source-data:/data/source
      - target-data:/data/target
      # 恢复页上传的备份暂存区（不含任何业务库，可随时丢弃）
      - restore-staging:/data/restore-staging
    environment:
      SOURCE_DB: /data/source/source.db
      TARGET_DB: /data/target/target.db
      DATA_DIR: /data
      RESTORE_DIR: /data/restore-staging
      SYNC_POLL_INTERVAL: "0.5"
      AUTO_CORRECT_INTERVAL: "2.5"
      SEED_SAMPLES: "20"
      # 以下均为测试钩子，生产保持默认：
      # SYNC_SNAPSHOT_DELAY_MS: "0"
      # RESTORE_VERIFY_DELAY_MS: "0"
      # RESTORE_FAIL_AFTER: ""
      # RESTORE_PAUSE_AFTER: ""
      # RESTORE_PAUSE_MS: "0"
    restart: unless-stopped

volumes:
  source-data:
  target-data:
  restore-staging:
